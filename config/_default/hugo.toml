copyright = "© Matteo Muscella"
defaultContentLanguage = "en"
enableRobotsTXT = true
locale = "en-US"
timeZone = "Europe/Rome"
timeout = "120s"
title = "Matteo Muscella"

[params]
  defaultTheme = "dark"
  description = "People, sport, wildlife and urban photography by Matteo Muscella."
  title = "Matteo Muscella — Photography"
  [params.home]
    eyebrow = "Independent photographer · Milan, Italy"
    headline = "Light, motion<br />and geometry."
    introduction = "Selected stories of people, sport, wildlife and urban life by Matteo Muscella."
    collectionsLabel = "Photography collections"
  [params.author]
    email = "matteo[dot]muscella[at]yahoo[dot]com"
    name = "Matteo Muscella"
  [params.socialIcons]
    #facebook = "https://www.facebook.com/MattMusc"
    instagram = "https://www.instagram.com/mattmusc"
    #github = "https://github.com/mattmusc"
    #youtube = "https://www.youtube.com/"
    #email = "mailto:user@example.com"
    website = "https://www.mattmusc.com"
    #mastodon = "https://example.com"
    #pixelfed = "https://example.com"
    #mixcloud = "https://mixcloud.com"
  [params.gallery]
    #boxSpacing = 10
    #targetRowHeight = 288
    #targetRowHeightTolerance = 0.25

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  resampleFilter = "CatmullRom"
  [imaging.jpeg]
    quality = 95
  [imaging.meta]
    fields = ["ImageDescription", "Orientation"]
    sources = ["exif"]

[module]
  [module.hugoVersion]
    min = "0.163.0"
  [[module.imports]]
    path = "github.com/nicokaiser/hugo-theme-gallery/v4"

[menu]
  [[menu.footer]]
    name = "GitHub"
    url = "https://github.com/mattmusc/mattmusc-hugo-portfolio/"
    weight = 3

[services]
  [services.rss]
    limit = 100
